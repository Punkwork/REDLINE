name: Godot validation and Windows playtest build

on:
  push:
    branches: ['**']
  pull_request:
    paths:
      - 'godot/**'
      - 'docs/**'
      - 'tools/**'
      - 'tests/python/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/godot-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.3'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # CSA-04f / CONSISTENCY-001a: the canonical card data, its generated doc views and the Python checks
      # (schema and decision IDs, generated-block drift, Node authority, agent-file equality).
      - name: Canonical source checks (CSA)
        shell: bash
        run: |
          python3 tools/csa/validate_cards.py
          python3 tools/csa/gen_card_docs.py --check
          python3 tools/map/export_maps.py --check   # MAP-003f: the game's maps match the validated generator
          python3 -m unittest discover -s tests/python
      - name: Install pinned Godot editor
        shell: bash
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo '7de56444b130b10af84d19c7e0cf63cf9e9937ee4ba94364c3b7dd114253ca21  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import and run rules checks
        shell: bash
        run: |
          GODOT="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --path godot --editor --import --quit 2>&1 | tee /tmp/import.log
          "$GODOT" --headless --path godot --script res://tests/test_game.gd 2>&1 | tee /tmp/rules.log
          "$GODOT" --headless --path godot --script res://tests/test_adp.gd 2>&1 | tee -a /tmp/rules.log
          "$GODOT" --headless --path godot --script res://tests/test_signal_carbon.gd 2>&1 | tee -a /tmp/rules.log
          # ARCH-V2-003: Architecture V2 ICE encounter components (parity with direct Game, hidden info, flyouts).
          "$GODOT" --headless --path godot --script res://tests/test_arch_v2_ice.gd 2>&1 | tee -a /tmp/rules.log
          # ARCH-V2-005: coverage table vs the V2 screen, header racks.
          "$GODOT" --headless --path godot --script res://tests/test_arch_v2_coverage.gd 2>&1 | tee -a /tmp/rules.log
          # ARCH-V2-006: Batch 3 encounter parts.
          "$GODOT" --headless --path godot --script res://tests/test_arch_v2_batch3.gd 2>&1 | tee -a /tmp/rules.log
          # ARCH-V2-007: Batch 4 (corporation look, integration).
          "$GODOT" --headless --path godot --script res://tests/test_arch_v2_batch4.gd 2>&1 | tee -a /tmp/rules.log
          # ARCH-V2-007d: the V2 encounter inside the real app (map, encounter, reward, next Node).
          "$GODOT" --headless --path godot --script res://tests/test_arch_v2_app.gd 2>&1 | tee -a /tmp/rules.log
          # ARCH-V2-007e: behaviour comparison, V2 screen vs Build 12's direct path on twin seeded games.
          "$GODOT" --headless --path godot --script res://tests/test_arch_v2_parity.gd 2>&1 | tee -a /tmp/rules.log
          # CSA-03 (CONSISTENCY-001a): CardDB loads godot/data/cards.json; parity with the old constants.
          "$GODOT" --headless --path godot --script res://tests/test_csa_cards.gd 2>&1 | tee -a /tmp/rules.log
          # CSA-04b (PROBE-004a): spec test written from the approved text, independent of the engine.
          "$GODOT" --headless --path godot --script res://tests/test_spec_probe.gd 2>&1 | tee -a /tmp/rules.log
          "$GODOT" --headless --path godot --script res://tests/test_spec_burned.gd 2>&1 | tee -a /tmp/rules.log
          "$GODOT" --headless --path godot --script res://tests/test_spec_pivot.gd 2>&1 | tee -a /tmp/rules.log
          # CORTEX-001 (designer 2026-11-28): random discard + counter per unprevented point; TURN-001 timing.
          "$GODOT" --headless --path godot --script res://tests/test_spec_cortex.gd 2>&1 | tee -a /tmp/rules.log
          # CARD-REVIEW-001: VOID ICEPICK reveal, TASER parting-shot suppression, STACK SMASH every ICE.
          "$GODOT" --headless --path godot --script res://tests/test_spec_card_review.gd 2>&1 | tee -a /tmp/rules.log
          # UI-TYPO-002 (M06): event typography and motion treatments, expectations from the approved table.
          "$GODOT" --headless --path godot --script res://tests/test_ui_typo_002.gd 2>&1 | tee -a /tmp/rules.log
          # UI-INSPECTOR-001: the shared hover/rollover inspector, expectations from the approved specification.
          "$GODOT" --headless --path godot --script res://tests/test_ui_inspector_001.gd 2>&1 | tee -a /tmp/rules.log
          # Playtest 13 notes: ledger inset, queued voice clips on one shared channel.
          "$GODOT" --headless --path godot --script res://tests/test_pt13_feedback.gd 2>&1 | tee -a /tmp/rules.log
          # CSA-04: canonical card records reach their consumers (Inspector contract, Uplink contract).
          "$GODOT" --headless --path godot --script res://tests/test_csa04_consumers.gd 2>&1 | tee -a /tmp/rules.log
          # UI-PROTOCOL-001 (issue #26): Protocol lifecycle, the ten playtest cards, the Active Protocol note.
          "$GODOT" --headless --path godot --script res://tests/test_ui_protocol_001.gd 2>&1 | tee -a /tmp/rules.log
          "$GODOT" --headless --path godot --script res://tests/test_ui_protocol_note.gd 2>&1 | tee -a /tmp/rules.log
          # UPLINK-SPEC-001 / MAP-003f: the Uplink visit, the generated map, and their V2 screens.
          "$GODOT" --headless --path godot --script res://tests/test_uplink_map.gd 2>&1 | tee -a /tmp/rules.log
          "$GODOT" --headless --path godot --script res://tests/test_map_uplink_ui.gd 2>&1 | tee -a /tmp/rules.log
          # MAP-TIER-001 / MAP-TIER-001a / ESCAPE-ICE-001: ICE tier by map row; HALCYON's Tier 2 roster.
          "$GODOT" --headless --path godot --script res://tests/test_map_tier.gd 2>&1 | tee -a /tmp/rules.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' /tmp/import.log /tmp/rules.log; then exit 1; fi
      - name: Architecture V2 ICE encounter screenshots (ARCH-V2-003; runs under CORE_LOOP)
        shell: bash
        env:
          SHOT_DIR: ${{ github.workspace }}/build/screenshots
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p "$SHOT_DIR"
          command -v xvfb-run >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q xvfb xauth)
          export XDG_DATA_HOME="$(mktemp -d)"
          xvfb-run -a -s '-screen 0 2600x1500x24' timeout 180 \
            "Godot_v${GODOT_VERSION}-stable_linux.x86_64" --audio-driver Dummy \
            --rendering-driver opengl3 --path godot --script res://tests/shot_arch_v2_ice.gd \
            2>&1 | tee /tmp/shot_arch_v2_ice.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' /tmp/shot_arch_v2_ice.log; then exit 1; fi
          grep -q 'ARCH-V2 ICE screenshots: 42 written' /tmp/shot_arch_v2_ice.log
          # CRED-COST-001: the CRED chip on the V2 card face.
          xvfb-run -a -s '-screen 0 2600x1500x24' timeout 120 \
            "Godot_v${GODOT_VERSION}-stable_linux.x86_64" --audio-driver Dummy \
            --rendering-driver opengl3 --path godot --script res://tests/shot_cred_cost.gd \
            2>&1 | tee /tmp/shot_cred_cost.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' /tmp/shot_cred_cost.log; then exit 1; fi
          grep -q 'CRED COST: 4 passed, 0 failed' /tmp/shot_cred_cost.log
          # UI-PROTOCOL-001: empty, several, overflow (top and end), inspector, reset after the encounter.
          xvfb-run -a -s '-screen 0 2600x1500x24' timeout 180 \
            "Godot_v${GODOT_VERSION}-stable_linux.x86_64" --audio-driver Dummy \
            --rendering-driver opengl3 --path godot --script res://tests/shot_ui_protocol_001.gd \
            2>&1 | tee /tmp/shot_ui_protocol_001.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' /tmp/shot_ui_protocol_001.log; then exit 1; fi
          grep -q 'UI-PROTOCOL-001 screenshots: 6 written (0 active after the encounter)' /tmp/shot_ui_protocol_001.log
          # UPLINK-SPEC-001 / MAP-003f: the Uplink room and the map board.
          for script in shot_uplink_room shot_node_map; do
            xvfb-run -a -s '-screen 0 2600x1500x24' timeout 180 \
              "Godot_v${GODOT_VERSION}-stable_linux.x86_64" --audio-driver Dummy \
              --rendering-driver opengl3 --path godot --script "res://tests/${script}.gd" \
              2>&1 | tee "/tmp/${script}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' "/tmp/${script}.log"; then exit 1; fi
          done
          grep -q 'UPLINK ROOM screenshots: 3 written' /tmp/shot_uplink_room.log
          grep -q 'NODE MAP screenshots: 5 written' /tmp/shot_node_map.log
          # UI-TYPO-002 (M06): the typography fixture on the production EventFlyout, lens and sandbox.
          xvfb-run -a -s '-screen 0 2600x1500x24' timeout 180 \
            "Godot_v${GODOT_VERSION}-stable_linux.x86_64" --audio-driver Dummy \
            --rendering-driver opengl3 --path godot res://tests/visual/ui_typo_event_fixture.tscn \
            2>&1 | tee /tmp/ui_typo_fixture.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|FIXTURE FAIL' /tmp/ui_typo_fixture.log; then exit 1; fi
          grep -q 'UI-TYPO-002 event fixture: 32 screenshots · PASS' /tmp/ui_typo_fixture.log
      - name: Verify screenshot states and large-hand interaction
        shell: bash
        env:
          SHOT_DIR: ${{ github.workspace }}/build/screenshots
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p "$SHOT_DIR"
          # STRIP-001 (designer approved 2026-11-21, "option 1"): the fixtures stage full-game states
          # (other Rustlers, passives, curves) that the core-loop build switches off. Skipped while Game.CORE_LOOP is true.
          if grep -q "^const CORE_LOOP := true" godot/scripts/core/game.gd; then
            echo "STRIP-001: core-loop build, legacy screenshot fixtures skipped"
            exit 0
          fi
          for script in shot_rustlers shot_hand shot_playtest2 shot_playtest3 shot shot_reel shot_friendly_lie shot_chrome shot_cartridges shot_adp shot_adp_phase3 shot_signal_carbon shot_facade shot_cards_pcb shot_trace_pixel shot_ice_analog; do
            xvfb-run -a -s '-screen 0 1600x1100x24' timeout 120 \
              "Godot_v${GODOT_VERSION}-stable_linux.x86_64" --audio-driver Dummy \
              --rendering-driver opengl3 --path godot --script "res://tests/${script}.gd" \
              2>&1 | tee "/tmp/${script}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' "/tmp/${script}.log"; then exit 1; fi
          done
      - name: Upload screenshots and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panopticon-verification
          path: |
            build/screenshots/*.png
            /tmp/import.log
            /tmp/rules.log
            /tmp/shot*.log
          retention-days: 14
      - name: Install matching Windows release template
        if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          curl --fail --location --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo 'f5f10dbaf56a7908349e64b94ea8c2c93c2cc11fb1014c9565b68a2bb437b922  /tmp/templates.tpz' | sha256sum --check
          unzip -q /tmp/templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d /tmp/export
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp /tmp/export/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Export Windows playtest build
        if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          mkdir -p build/windows
          "Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path godot \
            --export-release 'Windows Desktop' ../build/windows/PANOPTICON_HALCYON_slice.exe \
            2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/export.log; then exit 1; fi
          cp docs/HALCYON_PLAYTEST_GUIDE.md build/windows/README.md
          git rev-parse HEAD > build/windows/BUILD_COMMIT.txt
          cp docs/REDLINE_PLAYTEST_CHECKLIST.md build/windows/
          cp docs/REDLINE_CORE_LOOP_CHECKLIST.md build/windows/
          (cd build/windows && sha256sum PANOPTICON_HALCYON_slice.exe > SHA256SUMS.txt)
      - name: Name the build from the project version (RELEASE-002b)
        if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' godot/project.godot)"
          if ! [[ "$version" =~ -playtest\.([0-9]+)$ ]]; then
            echo "config/version '$version' must end in -playtest.N" >&2; exit 1
          fi
          echo "ARTIFACT_NAME=PANOPTICON-HALCYON-PLAYTEST-${BASH_REMATCH[1]}-${version}-Windows-x86_64" >> "$GITHUB_ENV"
      - name: Upload Windows playtest build
        if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/windows/
          if-no-files-found: error
          retention-days: 14
