name: Playtest 3 Windows executable smoke test
on:
  push:
    branches: ['codex/playtest3-windows-smoke']
    paths: ['.github/workflows/playtest3-windows-smoke.yml']
permissions:
  contents: read
  actions: read
jobs:
  windows-launch:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Wait for the post-merge export
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 43778252197 --repo Punkwork/REDLINE --exit-status --interval 10
      - uses: actions/download-artifact@v4
        with:
          name: PANOPTICON-HALCYON-PLAYTEST-3-0.3.0-playtest.3-Windows-x86_64
          run-id: 43778252197
          github-token: ${{ github.token }}
          path: playtest
      - name: Verify checksum and start the exported Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'playtest/PANOPTICON_HALCYON_slice.exe'
          $expected = ((Get-Content 'playtest/SHA256SUMS.txt').Trim() -split '\s+')[0]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Export checksum mismatch' }
          if (-not ((Get-Content 'playtest/README.md' -Raw).Contains('0.3.0-playtest.3'))) { throw 'Wrong playtest guide/version' }
          Write-Output "Windows executable SHA256: $actual"
          $process = Start-Process -FilePath $exe -ArgumentList @('--headless', '--audio-driver', 'Dummy', '--quit-after', '120') -PassThru -RedirectStandardOutput 'windows-stdout.log' -RedirectStandardError 'windows-stderr.log'
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Windows executable failed to exit within 60 seconds'
          }
          $process.Refresh()
          Get-Content 'windows-stdout.log'
          Get-Content 'windows-stderr.log'
          if ($process.ExitCode -ne 0) { throw "Windows executable exit code $($process.ExitCode)" }
          if (Select-String -Path 'windows-stdout.log', 'windows-stderr.log' -Pattern 'SCRIPT ERROR|Parse Error|ERROR:' -Quiet) { throw 'Godot startup errors' }
          Write-Output 'PASS: exported executable started on Windows, advanced 120 headless frames, and exited with code 0. Interactive rendering/play remains a manual check.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PLAYTEST-3-Windows-launch-logs
          path: windows-*.log
